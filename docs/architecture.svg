<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clef-architecture-title clef-architecture-desc">
      <title id="clef-architecture-title">How a question reaches Clef and comes back as SQL</title>
      <desc id="clef-architecture-desc">Data flow across the web user, server code, Clef Flash and read-only PostgreSQL: code grounds the question, Clef scores one batched set of choices, code builds and validates complete candidate plans, Clef ranks them, and code either runs the chosen read-only SQL, offers the readings to choose from, or refuses.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52647a"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0e7490"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8faff"/>

      <rect x="0" y="36" width="840" height="80" fill="rgba(30,41,59,0.018)"/>
      <rect x="0" y="196" width="840" height="80" fill="rgba(140,109,63,0.04)"/>

      <g stroke="rgba(30,41,59,0.12)" stroke-width="0.8">
        <line x1="0" y1="36" x2="840" y2="36"/>
        <line x1="0" y1="116" x2="840" y2="116"/>
        <line x1="0" y1="196" x2="840" y2="196"/>
        <line x1="0" y1="276" x2="840" y2="276"/>
        <line x1="0" y1="356" x2="840" y2="356"/>
        <line x1="140" y1="36" x2="140" y2="356"/>
      </g>

      <g font-family="'Geist Mono', monospace" text-anchor="middle">
        <g font-size="8" font-weight="600">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(30,41,59,0.12)"/><text x="196" y="14" dominant-baseline="central" fill="#1e293b">01</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(30,41,59,0.12)"/><text x="308" y="14" dominant-baseline="central" fill="#1e293b">02</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(30,41,59,0.12)"/><text x="420" y="14" dominant-baseline="central" fill="#1e293b">03</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(37,99,235,0.20)"/><text x="532" y="14" dominant-baseline="central" fill="#2563eb">04</text>
          <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(30,41,59,0.12)"/><text x="644" y="14" dominant-baseline="central" fill="#1e293b">05</text>
          <rect x="740" y="6" width="32" height="16" rx="8" fill="rgba(30,41,59,0.12)"/><text x="756" y="14" dominant-baseline="central" fill="#1e293b">06</text>
        </g>
        <g font-size="7" letter-spacing="0.14em" fill="#52647a">
          <text x="196" y="31">ASK</text>
          <text x="308" y="31">GROUND</text>
          <text x="420" y="31">DECIDE</text>
          <text x="532" y="31" fill="#2563eb">BUILD</text>
          <text x="644" y="31">RANK</text>
          <text x="756" y="31">ANSWER</text>
        </g>
        <g font-size="7" font-weight="500" letter-spacing="0.14em" fill="#52647a">
          <text x="70" y="72">WEB</text><text x="70" y="84">USER</text>
          <text x="70" y="152">SERVER</text><text x="70" y="164">CODE</text>
          <text x="70" y="232" fill="#8c6d3f">CLEF FLASH</text><text x="70" y="244" fill="#8c6d3f">DECISIONS API</text>
          <text x="70" y="312">POSTGRES</text><text x="70" y="324">READ-ONLY</text>
        </g>
      </g>

      <g fill="none" stroke-width="1">
        <path d="M246,76 H300 Q308,76 308,84 V123" stroke="#52647a" marker-end="url(#arr-muted)"/>
        <path d="M308,284 V189" stroke="#52647a" marker-end="url(#arr-muted)"/>
        <path d="M358,156 H412 Q420,156 420,164 V203" stroke="#52647a" marker-end="url(#arr-muted)"/>
        <path d="M470,236 H524 Q532,236 532,228 V189" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-accent)"/>
        <path d="M582,156 H636 Q644,156 644,164 V203" stroke="#52647a" marker-end="url(#arr-muted)"/>
        <path d="M694,236 H736 Q744,236 744,228 V189" stroke="#52647a" marker-end="url(#arr-muted)"/>
        <path d="M768,188 V283" stroke="#52647a" marker-end="url(#arr-muted)"/>
        <path d="M756,124 V109" stroke="#0e7490" marker-end="url(#arr-link)"/>
      </g>
      <rect x="480" y="218" width="36" height="12" rx="2" fill="#f8faff"/>
      <text x="498" y="227" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCORES</text>

      <g text-anchor="middle">
        <g>
          <rect x="146" y="44" width="100" height="64" rx="6" fill="#f8faff" stroke="rgba(30,41,59,0.25)"/>
          <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(30,41,59,0.12)"/>
          <text x="159" y="53" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#1e293b">USR</text>
          <text x="196" y="67" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#1e293b">Question</text>
          <text x="196" y="79" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">Thai or English</text>
          <text x="196" y="91" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">POST /api/query</text>
        </g>
        <g>
          <rect x="706" y="44" width="100" height="64" rx="6" fill="#f8faff" stroke="rgba(30,41,59,0.25)"/>
          <rect x="710" y="48" width="18" height="10" rx="3" fill="rgba(30,41,59,0.12)"/>
          <text x="719" y="53" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#1e293b">USR</text>
          <text x="756" y="67" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#1e293b">Result</text>
          <text x="756" y="79" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">table · readings</text>
          <text x="756" y="91" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">click to switch</text>
        </g>
        <g>
          <rect x="258" y="124" width="100" height="64" rx="6" fill="#f8faff" stroke="rgba(30,41,59,0.25)"/>
          <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(30,41,59,0.12)"/>
          <text x="271" y="133" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#1e293b">APP</text>
          <text x="308" y="147" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#1e293b">Ground question</text>
          <text x="308" y="159" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">read-only policy</text>
          <text x="308" y="171" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">dates · numbers · enums</text>
        </g>
        <g>
          <rect x="482" y="124" width="100" height="64" rx="6" fill="rgba(37,99,235,0.07)" stroke="#2563eb"/>
          <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(37,99,235,0.20)"/>
          <text x="495" y="133" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#2563eb">APP</text>
          <text x="532" y="147" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#1e293b">Build plans</text>
          <text x="532" y="159" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">beam · normalize</text>
          <text x="532" y="171" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">compile + validate</text>
        </g>
        <g>
          <rect x="706" y="124" width="100" height="64" rx="6" fill="#f8faff" stroke="rgba(30,41,59,0.25)"/>
          <rect x="710" y="128" width="18" height="10" rx="3" fill="rgba(30,41,59,0.12)"/>
          <text x="719" y="133" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#1e293b">APP</text>
          <text x="756" y="147" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#1e293b">Route answer</text>
          <text x="756" y="159" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">ok · choose · refuse</text>
          <text x="756" y="171" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">offer store</text>
        </g>
        <g>
          <rect x="370" y="204" width="100" height="64" rx="6" fill="rgba(140,109,63,0.06)" stroke="rgba(140,109,63,0.35)"/>
          <rect x="374" y="208" width="18" height="10" rx="3" fill="rgba(140,109,63,0.18)"/>
          <text x="383" y="213" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#8c6d3f">CLF</text>
          <text x="420" y="227" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#8c6d3f">Score choices</text>
          <text x="420" y="239" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">1 batched call</text>
          <text x="420" y="251" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">choice · noul</text>
        </g>
        <g>
          <rect x="594" y="204" width="100" height="64" rx="6" fill="rgba(140,109,63,0.06)" stroke="rgba(140,109,63,0.35)"/>
          <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(140,109,63,0.18)"/>
          <text x="607" y="213" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#8c6d3f">CLF</text>
          <text x="644" y="227" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#8c6d3f">Rank plans</text>
          <text x="644" y="239" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">1 call · plans + none</text>
          <text x="644" y="251" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">complete readings</text>
        </g>
        <g>
          <rect x="258" y="284" width="100" height="64" rx="6" fill="rgba(30,41,59,0.05)" stroke="#52647a"/>
          <rect x="262" y="288" width="18" height="10" rx="3" fill="rgba(30,41,59,0.12)"/>
          <text x="271" y="293" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#1e293b">PG</text>
          <text x="308" y="307" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#1e293b">Schema catalog</text>
          <text x="308" y="319" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">columns · values</text>
          <text x="308" y="331" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">coverage window</text>
        </g>
        <g>
          <rect x="706" y="284" width="100" height="64" rx="6" fill="rgba(30,41,59,0.05)" stroke="#52647a"/>
          <rect x="710" y="288" width="18" height="10" rx="3" fill="rgba(30,41,59,0.12)"/>
          <text x="719" y="293" dominant-baseline="central" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" fill="#1e293b">PG</text>
          <text x="756" y="307" font-size="9" font-weight="600" font-family="'Inter', sans-serif" fill="#1e293b">Run SQL</text>
          <text x="756" y="319" font-size="6.5" font-family="'Geist Mono', monospace" fill="#52647a">SELECT-only role</text>
          <text x="756" y="331" font-size="6.5" font-family="'Geist Mono', monospace" fill="#64748b">read-only tx · 5 s</text>
        </g>
      </g>

      <g font-family="'Geist Mono', monospace" font-size="7" fill="#52647a">
        <text x="144" y="375" letter-spacing="0.14em" font-weight="500">STEPS</text>
        <text x="220" y="375">01 ask · 02 ground · 03 decide · <tspan fill="#2563eb">04 build</tspan> · 05 rank · 06 answer</text>
        <text x="144" y="397" letter-spacing="0.14em" font-weight="500">CONCERN</text>
        <rect x="220" y="391" width="12" height="8" rx="2" fill="rgba(140,109,63,0.18)" stroke="rgba(140,109,63,0.35)"/>
        <text x="238" y="397">Clef call: scores options we supply, never writes SQL</text>
        <rect x="508" y="391" width="12" height="8" rx="2" fill="rgba(37,99,235,0.07)" stroke="#2563eb"/>
        <text x="526" y="397">Focal: code turns scores into checked plans</text>
        <text x="144" y="419" letter-spacing="0.14em" font-weight="500">FLOW</text>
        <line x1="220" y1="416" x2="244" y2="416" stroke="#52647a" marker-end="url(#arr-muted)"/>
        <text x="252" y="419">hand-off</text>
        <line x1="316" y1="416" x2="340" y2="416" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-accent)"/>
        <text x="348" y="419">focal hand-off</text>
        <line x1="436" y1="416" x2="460" y2="416" stroke="#0e7490" marker-end="url(#arr-link)"/>
        <text x="468" y="419">result to user</text>
      </g>
    </svg>
